# ============================================================
# 【アプリケーションDAG設定テンプレート】
# 新規アプリ作成時はこのファイルをコピーし、<アプリ名>.yaml として保存してください。
# ============================================================

# 1. 基本情報（必須）
name: ""                        # アプリケーション名（DAG ID: dag_app_<name> になります）
owner: ""                       # 担当チーム名
tags:                           # Airflow UIで検索・分類するためのタグ
  - "app"

# 2. 定期実行スケジュール（任意）
# ※ Cron式（例: "0 2 * * *"）または null
schedule: null

# 3. 先行トリガー（前段の Asset URI 一覧: schedule との併用または単独指定）
# ※ 前段マートやデータ更新を検知して動かす場合に指定
schedule_assets:
  - ""

# 4. 完了通知（自身が発行する Asset URI）
# ※ 後続DAGに更新を通知する URI を指定します（後続がない場合は省略可）
outlet_asset: ""

# 5. 実行タスク定義（上から順に直列実行されます）
# ※ タスク名: コマンド文字列 の形式で記述してください
tasks:
  task_1:
    command: "python3 scripts/<スクリプト1>.py"
  task_2:
    command: "python3 scripts/<スクリプト2>.py"
