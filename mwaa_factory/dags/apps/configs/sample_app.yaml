# ============================================================
# 【設定実例】sample_app アプリケーション設定
# ============================================================
name: "sample_batch"
owner: "app-team"
tags:
  - "app"
  - "sample"

# 毎日深夜2時に実行
schedule: "0 2 * * *"

# 前段マート（user_summary）の更新完了を検知して起動する場合
schedule_assets:
  - "redshift://prod_cluster/dev/mart_schema/user_summary"

# 完了通知
outlet_asset: "app://sample_batch/completed"

# 実行タスク
tasks:
  preprocess:
    command: "echo 'Preprocess for date: {{ params.target_date if params.target_date else ds }}'"
  
  main_process:
    command: "echo 'Executing main batch job...'"
  
  post_process:
    command: "echo 'Postprocess completed.'"
